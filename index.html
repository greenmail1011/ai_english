<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="description" content="Fly High! 無人機英語繪本圖書館｜未來斑馬AI創新學苑">
<title>Fly High! 無人機英語繪本</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sniglet:wght@400;800&family=Andika:wght@400;700&family=Noto+Sans+TC:wght@400;700&display=swap">
<style>
/* Layout: a bright reading room — wall sign, an oak bookcase of spines → pick a book, it flies out and opens into a page-turning spread */
:root{color-scheme:light;
  --wall:#fff4dc; --wall2:#ffe9c2; --oak:#e2b07a; --oak-d:#c48a52; --oak-l:#f2cf9f; --paper:#fffdf6; --ink:#2f2a2a; --muted:#7a6b57;
  --talk:#2c7fb8; --sight:#e8772e; --phon:#2f6fd0; --red:#c8323c; --trace:#2f7fc4; --navy:#24427a; --gold:#f1c84b;
  --display:"Sniglet","Comic Sans MS",system-ui,sans-serif; --read:"Andika","Century Gothic","Trebuchet MS",system-ui,sans-serif; --zh:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--wall);color:var(--ink);font-family:var(--read);overflow-x:hidden}
button{font:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--sight);outline-offset:2px}

/* ---------- library room ---------- */
.room{min-height:100%;padding-inline:16px;padding-block:22px 30px;
  background:radial-gradient(circle at 10% 0%,#fff9e8 0,transparent 40%),radial-gradient(circle,#f6dcb0 1.4px,transparent 1.6px) 0 0/26px 26px,linear-gradient(var(--wall),var(--wall2))}
.wrap{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.sign{display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap;text-align:center}
.sign img{width:62px;height:auto}
.board{background:var(--paper);border:6px solid var(--oak);border-radius:16px;padding:10px 24px;box-shadow:0 8px 0 var(--oak-d),0 18px 30px -18px rgba(90,50,10,.5)}
.board h1{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(1.8rem,4.5vw,2.8rem);color:#e2457a;line-height:1}
.board p{margin:4px 0 0;font-family:var(--zh);color:var(--muted);font-size:.95rem}
.hint{font-family:var(--zh);text-align:center;color:var(--muted);margin:0}

.case{background:linear-gradient(90deg,var(--oak-d),var(--oak) 6%,var(--oak) 94%,var(--oak-d));border-radius:18px 18px 8px 8px;padding:18px 18px 10px;box-shadow:inset 0 0 0 4px rgba(255,255,255,.18),0 24px 40px -20px rgba(90,50,10,.55)}
.shelf{position:relative;background:linear-gradient(#b9814b,#d39d64 30%,#e4b37c);border-radius:8px;padding:18px 18px 0;margin-bottom:16px;min-height:290px;display:flex;align-items:flex-end;gap:6px;overflow-x:auto;overflow-y:visible;box-shadow:inset 0 10px 18px -6px rgba(70,35,5,.45)}
.shelf::after{content:"";position:absolute;left:0;right:0;bottom:0;height:16px;background:linear-gradient(var(--oak-l),var(--oak-d));border-radius:0 0 6px 6px}
.plate{position:absolute;left:50%;bottom:-1px;transform:translateX(-50%);z-index:3;background:linear-gradient(#f6e1a3,#d9b45a);border:1.5px solid #a07a2a;border-radius:6px;padding:2px 12px;font-family:var(--zh);font-size:.78rem;color:#5a4210;white-space:nowrap}
.spine{position:relative;z-index:2;flex:none;width:58px;border:0;border-radius:5px 5px 2px 2px;margin-bottom:16px;padding:14px 0 10px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;color:#fff;
  background:linear-gradient(90deg,rgba(0,0,0,.22),rgba(255,255,255,.18) 30%,rgba(255,255,255,0) 55%,rgba(0,0,0,.25)),var(--c);
  box-shadow:2px 0 0 rgba(0,0,0,.12),0 6px 10px -6px rgba(0,0,0,.5);transition:transform .25s,box-shadow .25s}
.spine::before,.spine::after{content:"";position:absolute;left:0;right:0;height:5px;background:rgba(255,255,255,.55)}
.spine::before{top:8px}.spine::after{bottom:30px}
.spine:hover,.spine:focus-visible{transform:translateY(-16px);box-shadow:0 18px 18px -10px rgba(0,0,0,.45)}
.spine .t{writing-mode:vertical-rl;font-family:var(--display);font-weight:800;font-size:1.05rem;letter-spacing:.04em;text-shadow:0 1px 0 rgba(0,0,0,.25)}
.spine .zh{writing-mode:vertical-rl;font-family:var(--zh);font-size:.72rem;opacity:.95}
.spine .n{min-width:30px;height:30px;padding:0 4px;border-radius:15px;font-size:.78rem!important;background:var(--navy);box-shadow:0 0 0 2.5px var(--gold);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:.85rem}
.spine.lean{transform:rotate(-6deg);transform-origin:bottom left;margin-left:10px}
.spine.lean:hover{transform:rotate(-6deg) translateY(-16px)}

.room .foot{font-family:var(--zh);font-size:.8rem;color:var(--muted);text-align:center}
.voice{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;font-family:var(--zh);font-size:.88rem;color:var(--muted)}
.voice select{font:inherit;max-width:100%;padding:4px 8px;border-radius:8px;border:1.5px solid #e2cfae;background:#fff;color:var(--ink)}
.chip{border:2px solid var(--ink);background:#fff;border-radius:999px;padding:4px 14px;font-family:var(--display);color:var(--ink)}

/* ---------- flying book ---------- */
.flyer{position:fixed;z-index:50;transform-origin:left center;transition:left .7s cubic-bezier(.3,.1,.2,1),top .7s cubic-bezier(.3,.1,.2,1),width .7s cubic-bezier(.3,.1,.2,1),height .7s cubic-bezier(.3,.1,.2,1),transform .7s cubic-bezier(.3,.1,.2,1);box-shadow:0 30px 50px -20px rgba(0,0,0,.5);border-radius:4px;overflow:hidden;pointer-events:none}
.flyer svg{width:100%;height:100%;display:block}

/* ---------- reader ---------- */
.reader{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;background:radial-gradient(ellipse at 50% 60%,#fffaf0 0,#f3e2c4 70%);transition:opacity .35s}
.reader[hidden]{display:none!important}
.reader.fade{opacity:0}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top,0px))}
.bar .ttl{font-family:var(--display);font-weight:800;font-size:1.1rem;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar select{font:inherit;font-family:var(--zh);font-size:.85rem;padding:4px 8px;border-radius:8px;border:1.5px solid #e2cfae;background:#fff;max-width:46vw}
.pcount{font-family:var(--zh);font-size:.85rem;color:var(--muted);white-space:nowrap}
.stage{flex:1;display:grid;place-items:center;perspective:2600px;padding:6px 16px 10px;min-height:0;touch-action:pan-y}
.book{position:relative;transition:transform .8s cubic-bezier(.3,.1,.2,1);transform-style:preserve-3d}
.book::before{content:"";position:absolute;inset:-10px -12px -14px;border-radius:10px;background:#c9864f;box-shadow:0 30px 50px -24px rgba(60,30,5,.6);transform:translateZ(-2px);transition:opacity .5s}
.book.closed::before{opacity:0}
.single.book::before{inset:-8px -10px -12px 0}
.leaf{position:absolute;top:0;left:50%;width:50%;height:100%;transform-origin:left center;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.35,.1,.2,1)}
.single .leaf{left:0;width:100%}
.leaf.flipped{transform:rotateY(-180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;background:var(--paper)}
.face.back{transform:rotateY(180deg)}
.face.front{border-radius:0 6px 6px 0}.face.back{border-radius:6px 0 0 6px}
.face.front::after,.face.back::after{content:"";position:absolute;top:0;bottom:0;width:9%;pointer-events:none}
.face.front::after{left:0;background:linear-gradient(90deg,rgba(80,50,20,.22),transparent)}
.face.back::after{right:0;background:linear-gradient(-90deg,rgba(80,50,20,.22),transparent)}
.leaf.turning .face::before{content:"";position:absolute;inset:0;z-index:5;pointer-events:none;animation:shade .9s ease-in-out}
@keyframes shade{0%{background:rgba(0,0,0,0)}50%{background:rgba(60,40,20,.18)}100%{background:rgba(0,0,0,0)}}
.ear{position:absolute;bottom:0;width:7%;aspect-ratio:1;z-index:4;pointer-events:none;opacity:.9}
.face.front .ear{right:0;background:linear-gradient(135deg,transparent 50%,#efe3c8 50%,#fff 70%);box-shadow:-2px -2px 4px rgba(0,0,0,.08)}
.face.back .ear{left:0;background:linear-gradient(-135deg,transparent 50%,#efe3c8 50%,#fff 70%)}
.cover-face .ear{display:none}
.nav{display:flex;justify-content:center;gap:12px;padding:0 16px calc(14px + env(safe-area-inset-bottom,0px))}
.nav button{border:2px solid var(--ink);background:#fff;border-radius:999px;padding:6px 20px;font-family:var(--display);color:var(--ink)}
.nav button:disabled{opacity:.3;cursor:default}

/* ---------- page content (em-based; .book sets font-size from page width) ---------- */
.pg{position:absolute;inset:0;padding:5% 6%;display:flex;flex-direction:column;color:var(--ink)}
.pg .no{position:absolute;bottom:3.2%;width:1.9em;height:1.9em;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:.8em;box-shadow:0 0 0 .2em var(--gold);z-index:3}
.face.front .pg .no{right:3.5%}.face.back .pg .no{left:3.5%}.single .face .pg .no{right:3.5%;left:auto}
.pg .art{position:absolute;inset:0}
.pg .art svg{width:100%;height:100%;display:block}
.pg.sent .line{position:absolute;left:5%;right:12%;bottom:6%;display:flex;align-items:center;gap:.5em;background:rgba(255,255,255,.88);border-radius:.6em;padding:.3em .6em;font-size:1.45em;line-height:1.2;z-index:2}
.say{flex:none;width:1.7em;height:1.7em;font-size:.82em;border-radius:50%;border:.12em solid var(--ink);background:var(--gold);display:grid;place-items:center;color:var(--ink);padding:0}
.say svg{width:55%;height:55%}
.tab{position:absolute;left:0;top:0;background:var(--talk);color:#fff;padding:.4em .9em .5em;border-bottom-right-radius:.8em;font-family:var(--display);line-height:1.05;z-index:2;max-width:60%}
.tab b{display:block;font-size:1.6em}
.hl{color:var(--red);font-weight:700}
.blank{color:transparent;-webkit-text-stroke:.05em var(--trace);border-bottom:.1em solid var(--trace);padding:0 .15em}
.cover-face .pg{padding:0}.cover-face svg{width:100%;height:100%;display:block}
.pg h2{font-family:var(--display);font-size:1.7em;margin:0 0 .4em;color:var(--sight)}
.toc{display:grid;grid-template-columns:1fr 1fr;gap:.25em 1.2em;font-size:.95em;margin:0;padding:0;list-style:none}
.toc li{display:flex;justify-content:space-between;gap:.5em;border-bottom:1px dashed #e3d6bd;padding:.15em 0}
.toc li span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toc .u{color:var(--talk);font-size:.8em;margin-right:.3em}
.wgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:.3em;font-size:.9em}
.wgrid span{display:flex;justify-content:space-between;align-items:center;border:1px solid #2f2a2a33;border-radius:.3em;padding:.15em .4em}
.wgrid i{font-style:normal;font-size:.7em;background:var(--navy);color:#fff;border-radius:50%;width:1.7em;height:1.7em;display:grid;place-items:center}
.intro{font-size:.82em;line-height:1.45;margin:0 0 .6em}
.intro .zh{font-family:var(--zh);color:var(--muted)}
.lyric{font-size:1.15em;line-height:1.55;white-space:pre-line;margin:0}
.tune{font-family:var(--zh);font-size:.75em;color:var(--muted);margin:.1em 0 .6em}
/* sight word page */
.sw{display:grid;grid-template-columns:1fr 1.15fr;grid-template-rows:1fr auto;gap:.5em .8em;height:100%}
.sw .big{font-family:var(--display);font-weight:800;font-size:3.6em;line-height:1;color:var(--sight)}
.lbl{font-weight:700;font-size:.85em;margin-top:.3em}
.lbl::before{content:"";display:inline-block;width:.6em;height:.6em;border-radius:50%;background:var(--red);margin-right:.4em}
.trow{position:relative;height:2.9em;border-top:2px solid #a9c2d4;border-bottom:2.5px solid #4a6a85;background:linear-gradient(transparent 46%,#a9c2d4 46%,#a9c2d4 49%,transparent 49%);margin-top:.35em}
.trow svg{position:absolute;left:.3em;bottom:-.55em;height:3.9em;overflow:visible;max-width:100%}
.sw .art{position:relative;border-radius:.6em;overflow:hidden;min-height:0}
.sw .sents{grid-column:1/-1;display:flex;flex-direction:column;gap:.3em;font-size:1.2em;padding-right:2em}
.sw .sents div{display:flex;align-items:center;gap:.45em}
/* phonics */
.ltab{display:inline-block;color:#fff;border-radius:.3em 1em 1em .3em;padding:.25em .9em;font-style:italic;align-self:flex-start}
.ltab b{font-family:var(--display);font-style:normal;font-size:1.5em;margin-left:.15em}
.big2{font-weight:700;font-size:1.5em;line-height:1;margin-top:.35em}
.ph1{display:grid;grid-template-columns:1fr 1fr;gap:.8em;height:100%}
.wcards{display:grid;gap:.4em;align-content:center}
.wcards.four{grid-template-columns:1fr 1fr}
.wc{display:flex;align-items:center;gap:.4em;border:1.5px dashed #e3d6bd;border-radius:.6em;padding:.25em .45em;font-size:1.05em;min-width:0}
.wc .emo{font-size:1.8em;line-height:1;width:1.3em;text-align:center;flex:none}
.wc .picsvg{width:2.2em;height:2.2em;flex:none}
.wc>span:not(.emo){flex:1;min-width:0;overflow-wrap:normal;word-break:keep-all;font-size:.9em}
.circ i{font-style:normal;cursor:pointer;border-radius:50%;padding:0 1px}
.circ i.on{box-shadow:0 0 0 2px var(--red)}
.no-shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.act{font-size:.9em;margin:0 0 .4em}.act .zh{display:block;font-family:var(--zh);font-size:.8em;color:var(--muted)}
.outline{width:78%;height:auto;margin:auto;display:block;cursor:pointer}
.hgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:.35em}
.hc{font-family:var(--read);font-size:1.3em;aspect-ratio:1;border:1.5px solid #e3d6bd;border-radius:50%;background:#fffefa;color:var(--ink);padding:0}
.hc.on{box-shadow:0 0 0 .18em var(--red);background:#fde6d3}
.hscore{font-family:var(--zh);color:var(--muted);font-size:.85em;margin:.4em 0 0}
.frames{display:grid;grid-template-columns:1fr 1fr;gap:.8em;height:100%}
.frame{border:2px dashed #e2a0a0;border-radius:.6em;padding:.6em;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.4em;text-align:center;font-size:1.05em}
.frame:nth-child(2){border-color:#9ccf7f}.frame .emo{font-size:3em}.frame .picsvg{width:4em;height:4em}.frame p{margin:0}
.backc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.6em;background:var(--bc,#2c7fb8);color:#fff;text-align:center;font-family:var(--zh)}
.backc .card{background:#fffdf6;color:var(--ink);border-radius:1em;padding:1em 1.6em;display:flex;flex-direction:column;align-items:center;gap:.3em}
.backc img{width:3.6em}
.title-pg{align-items:center;justify-content:center;text-align:center;gap:.4em}
.title-pg .t1{font-family:var(--display);font-weight:800;font-size:2.4em;color:#e2457a}
.title-pg .t2{font-size:1.1em}
.shelf{justify-content:space-between;gap:10px}
.shelf .row{display:flex;align-items:flex-end;gap:4px;flex:none}
.shelf .deco{flex:none;margin:0 0 16px;align-self:flex-end;display:block}
.faceout{flex:none;position:relative;z-index:2;border:0;padding:0;background:transparent;width:196px;margin-bottom:22px;transform:rotate(-3deg);transition:transform .25s}
.faceout svg{display:block;width:100%;height:auto;border-radius:6px;box-shadow:0 14px 16px -10px rgba(0,0,0,.5)}
.faceout .stand{position:absolute;left:30%;right:30%;bottom:-8px;height:10px;background:#8a5a30;border-radius:3px}
.faceout:hover,.faceout:focus-visible{transform:rotate(0) translateY(-10px)}
@media (max-width:980px){.shelf .deco:nth-of-type(n+3){display:none}}
@media (max-width:640px){.faceout{display:none}.shelf .deco{display:none}.shelf{justify-content:center;padding:14px 8px 0;min-height:0}.shelf .row{gap:3px}.spine{width:44px}.spine .t{font-size:.92rem}}
@media (max-width:640px){.shelf{min-height:250px}.spine{width:50px}.deco{display:none}}
@media (prefers-reduced-motion:reduce){.leaf,.book,.flyer,.spine{transition:none}}
</style>
</head>
<body>



<div class="room">
 <div class="wrap">
  <div class="sign"><img id="brand" alt="Future Zebra 未來斑馬"><div class="board"><h1>Fly High! 繪本圖書館</h1><p>未來斑馬AI創新學苑 · 學齡前無人機科技英語繪本</p></div></div>
  <p class="hint">從書架抽一本書，點右頁往後翻、點左頁往回翻（也可以用 ← → 鍵或左右滑動）</p>
  <div class="case" id="case"></div>
  <div class="voice"><label for="voiceSel">朗讀聲音</label><select id="voiceSel"></select><button class="chip" id="voiceTest" type="button">試聽</button></div>
  <p class="foot">© 2026 未來斑馬AI創新學苑 · 架構參考 Say "Hi" 系列：生活對話 6 冊、高頻字 4 冊、自然發音 4 冊</p>
 </div>
</div>
<div class="reader" id="reader" hidden>
 <div class="bar"><button class="chip" id="closeBtn" type="button">← 回書架</button><span class="ttl" id="rtitle"></span><select id="toc" aria-label="跳到章節"></select><span class="pcount" id="pcount"></span></div>
 <div class="stage" id="stage"></div>
 <div class="nav"><button id="prev" type="button">‹ 上一頁</button><button id="next" type="button">下一頁 ›</button></div>
</div>
<script>
/* ================= DATA ================= */
const TALK = [
 {n:1, title:'Drone Talk and Good Habits', units:[
  ['Good Morning','早安',['Good morning, Drone.','Good morning, Robot.','Good morning, teacher.','Good morning, pilots.']],
  ['Say Hi','打招呼',['Hello! My name is Zippy.','Hi, Zippy. My name is Kiki.','Nice to meet you.','Let\'s fly together!']],
  ['I Can','我會',['I can fly.','I can go up.','I can go down.','I can land.']],
  ['Ready to Fly','準備飛行',['I take my drone.','I check the battery.','I put on my goggles.','I am ready!']],
  ['Having Fun','好好玩',['Up, up, up!','Down, down, down!','Round and round!','This is fun!']],
  ['Low Battery','沒電了',['My drone is tired.','The battery is low.','Charge the battery.','Now it is full!']],
  ['May I?','我可以嗎？',['May I fly?','May I have a turn?','May I hold the remote?','Yes, you may.']],
  ["Don't Do That",'不可以',["Don't touch the propellers.","Don't fly near people.","Don't fly in the rain.","Don't run."]],
  ['Clean My…','清潔',['I clean my drone.','I clean the propellers.','I clean the table.','I put it away.']],
  ['Are You Ready?','準備好了嗎？',['Are you ready?','Three, two, one.','Take off!','Good job!']]],
  songs:[['Good Morning, Drone!','曲調：Good Morning to You（公版）','Good morning, drone!\nGood morning, drone!\nGood morning, little drone,\nLet\'s fly up and go!'],
         ['Twinkle, Twinkle, Little Drone','曲調：Twinkle Twinkle Little Star（公版）','Twinkle, twinkle, little drone,\nFlying high and flying home.\nUp above the trees so tall,\nRed and round just like a ball.']]},
 {n:2, title:'Drone Talk and Good Habits', units:[
  ['Move Like a Drone','像無人機一樣動',['Go up.','Go down.','Turn left.','Turn right.']],
  ['I Like…','我喜歡…',['I like drones.','I like robots.','I like rockets.','I like computers.']],
  ['I Like to…','我喜歡做…',['I like to fly.','I like to build.','I like to code.','I like to draw.']],
  ['Colors','顏色',['The drone is red.','The light is green.','The ball is yellow.','The sky is blue.']],
  ['Drone Soccer','無人機足球',['This is drone soccer.','Fly to the goal.','Go through the ring.','Goal!']],
  ['Good Manners','有禮貌',['Please wait.','Thank you, coach.','Sorry!','Excuse me.']],
  ['Help Others','幫助別人',['Can I help you?','I hold the box.','We fix the drone.','Thank you for helping.']],
  ['Respect Others','尊重別人',['Wait your turn.','Listen to the coach.','Cheer for your friends.','Shake hands.']],
  ["Don't Do That…",'不可以這樣做',["Don't throw the drone.","Don't step on it.","Don't pull the wires.","Don't eat near the robot."]],
  ['Take Care of…','愛護…',['Take care of your drone.','Take care of the battery.','Take care of the remote.','Take care of your friends.']]],
  songs:[['Drones Are Flying Up and Down','曲調：London Bridge（公版）','Drones are flying up and down,\nUp and down, up and down.\nDrones are flying up and down,\nAll around the town!'],

// arms for every character: pose = remote | cheer | wave | point
function arms(c,pose,sh=-130,sx=42){
  const A=(cx,cy,rot)=>P(`<ellipse cx="${cx}" cy="${cy}" rx="15" ry="36" transform="rotate(${rot} ${cx} ${cy})"/>`,c);
  if(pose==='cheer') return A(-sx-18,sh-30,-35)+A(sx+18,sh-30,35);
  if(pose==='wave')  return A(-sx+2,sh+22,20)+A(sx+20,sh-30,40);
  if(pose==='point') return A(-sx+2,sh+22,20)+A(sx+26,sh-14,70);
  return A(-sx+16,sh+14,-55)+A(sx-16,sh+14,55)+remote(0,sh+10);
}

function sceneArt(raw,seed=0){
  const t=String(raw).replace(/[\[\]{}]/g,'').toLowerCase().replace(/my name is mia/,'my name is kiki');
  const tm=t.replace(/\b(hands up|sit up|line up|clean up|wake up|pick up|give up|grow up|stand up|up straight|line)\b/g,' ');
  const hits=[]; const used=new Set();
  for(const [re,key,slot] of RULES){ if(re.test(t)&&!used.has(key.split(':')[0])){ used.add(key.split(':')[0]); hits.push({key,slot,idx:t.search(re)}); } }
  hits.sort((a,b)=>a.idx-b.idx);
  const sky=hits.filter(h=>h.slot==='sky').slice(0,2), ground=hits.filter(h=>h.slot!=='sky').slice(0,2);
  const droneSpeaks=/\b(i am zippy|my name is zippy|i'm zippy)\b/.test(t);
  const itDrone=/\b(it|it's)\b/.test(t) && !/\b(it's|it is)( a)? (sunny|windy|rainy|cloudy|raining|time|snack|fun|my turn|hot|cold|warm|not a toy|safe)\b|\bplug it\b|\bturn it on\b|\bdo it\b|\bdid it\b/.test(t);
  const cheer=/good (job|flying|landing|teamwork)|very good|well done|i did it|great job|\byay\b|good time|\bfun\b/.test(t);
  const wantDrone=droneSpeaks || DRONEY.test(tm) || itDrone || /\bdrone\b/.test(t);
  const wantPeople=!droneSpeaks && (PEOPLE.test(t) || cheer || (!hits.length && !wantDrone));
  const many=MANY.test(t)||/teamwork/.test(t);

}

const SHELF_SET={talk:['flat:#7dbb5c,#ffd166,#e85b5b','trophy','drone','plant'],sight:['bookend','blocks','robot','flat:#5aa6d8,#c27ae0,#ffb340,#7dbb5c','globe'],phon:['abc','frame','rocket','flat:#ef8fb0,#5aa6d8','plant']};
const deco=k=>k.startsWith('flat:')?flatBooks(k.slice(5).split(',')):DECOS[k]();
function buildShelves(){
  const html=['talk','sight','phon'].map(k=>{
    const list=BOOKS.filter(b=>b.kind===k), first=list[0], set=SHELF_SET[k];
    const spines=list.map((b,j)=>{const h=[258,248,266,252,262,250][j%6];
      return `<button class="spine" data-id="${b.id}" style="--c:${SERIES[k].c[j%SERIES[k].c.length]};height:${h}px" aria-label="打開 ${b.title}">
        <span class="t">${esc(b.t)}</span><span class="zh">${esc(b.zh)}</span><span class="n">${esc(b.label)}</span></button>`;}).join('');
    const face=`<button class="faceout" data-id="${first.id}" aria-label="打開 ${first.title}">${coverOf(first)}<span class="stand"></span></button>`;
    const left=set.slice(0,1).map(deco).join(''), right=set.slice(1).map(deco).join('');
    return `<div class="shelf">${left}${face}<div class="row">${spines}</div>${right}<span class="plate">${SERIES[k].plate}</span></div>`;}).join('');
  document.getElementById('case').innerHTML=html;
}

  const b=B.data, P=[coverPage(B)], toc=[];
  P.push({html:pg('',`<h2>Contents</h2><ul class="toc">${b.units.map((u,i)=>`<li><span><span class="u">Unit ${i+1}</span>${esc(u[0])}</span><span>${2+i*4}</span></li>`).join('')}${b.songs.map((s,i)=>`<li><span><span class="u" style="color:#7a4fa3">Song ${i+1}</span>${esc(s[0])}</span><span>${42+i*2}</span></li>`).join('')}<li><span>Words in This Book</span><span>46</span></li></ul>`,1)});
  toc.push(['目錄 Contents',1]);
  b.units.forEach((u,i)=>{toc.push([`Unit ${i+1} ${u[0]}`,P.length]);
    u[2].forEach((s,p)=>{const n=P.length;
      P.push({html:pg('sent',`<div class="art" data-scene="${esc(s)}" data-seed="${i*4+p}"></div>${p===0?`<div class="tab"><b>${i+1}</b>${esc(u[0])}</div>`:''}<div class="line">${sayBtn(s)}<span>${esc(s)}</span></div>`,n)});});});
  b.songs.forEach((s,i)=>{toc.push([`Song ${i+1} ${s[0]}`,P.length]);
    P.push({html:pg('',`<h2 style="color:#7a4fa3">Song ${i+1}</h2><div style="font-family:var(--display);font-size:1.2em">${esc(s[0])}</div><p class="tune">${esc(s[1])}　歌詞為本系列原創</p><p class="lyric">${esc(s[2])}</p><div style="margin-top:.6em">${sayBtn(s[2])}</div>`,P.length)});
    P.push({html:pg('sent',`<div class="art" data-scene="we sing the drone song together" data-seed="${i+7}"></div>`,P.length)});});
  const words=[...new Set(b.units.flatMap(u=>u[2].join(' ').replace(/[^A-Za-z' ]/g,' ').split(/\s+/)).filter(Boolean).map(w=>w==='I'?w:w.toLowerCase()))].sort((a,c)=>a.localeCompare(c));
  toc.push(['Words in This Book',P.length]);
  P.push({html:pg('',`<h2>Words in This Book</h2><div class="wgrid" style="grid-template-columns:repeat(6,1fr);font-size:.75em">${words.map(w=>`<span>${esc(w)}</span>`).join('')}</div>`,P.length)});
  P.push(backPage(B)); return {P,toc};
}
function sightPages(B){
  const b=B.data, P=[coverPage(B)], toc=[], W=b.words, half=Math.ceil(W.length/2);
  P.push(titlePage(B,1));
  const tbl=(arr,off)=>`<div class="wgrid">${arr.map((w,k)=>`<span>${esc(w[0])}<i>${off+k+4}</i></span>`).join('')}</div>`;
  toc.push(['字表 Word list',2]);
  P.push({html:pg('',`<h2 style="color:#c0392b;font-size:1.3em">What is "220 Sight Words"?</h2><p class="intro">Sight words are little words we see again and again. Many can't be drawn or sounded out, so we learn to know them at a glance.<br><span class="zh">高頻字要「一眼認得」。每頁一個字：先描寫兩次，再讀兩個無人機句子（虛線＝描寫，紅字＝本頁的字）。</span></p><div class="lbl" style="margin-bottom:.3em">The sight words in this book (${b.k}):</div>${tbl(W.slice(0,Math.min(half,20)),0)}`,2)});
  P.push({html:pg('',tbl(W.slice(Math.min(half,20)),Math.min(half,20)),3)});
  W.forEach((w,k)=>{ if(k%10===0) toc.push([`${w[0]} …（p.${P.length}）`,P.length]);
    P.push({html:pg('',`<div class="sw"><div><div class="big">${esc(w[0])}</div><div class="lbl">Trace and Read.</div><div class="trow">${traceSVG(w[0])}</div><div class="trow">${traceSVG(w[0])}</div></div>
      <div class="art" data-scene="${esc(w[1]+' '+w[2])}" data-seed="${k}"></div>
      <div class="sents"><div>${sayBtn(w[1])}<span>${fmt(w[1])}</span></div><div>${sayBtn(w[2])}<span>${fmt(w[2])}</span></div></div></div>`,P.length)});});
  if(P.length%2===0) P.push(blankPage(P.length));
  P.push(backPage(B)); return {P,toc};
}
function phonPages(B){
  const b=B.data, P=[coverPage(B)], toc=[], L=PHON.slice(b.from,b.to);
  P.push(titlePage(B,1));
  L.forEach(([ch,words,s1,s2],i)=>{const n0=b.from+i+1, lo=ch.toLowerCase(), col=LCOL[n0%LCOL.length];
    toc.push([`Lesson ${n0}: ${b.mode==='small'?lo:b.mode==='big'?ch:ch+' '+lo}`,P.length]);
    if(b.mode!=='rw'){const big=b.mode==='big', t=big?ch:lo, ws=big?words.slice(0,3):words.slice(1,4);
      P.push({html:pg('',`<div class="ph1"><div><div class="ltab" style="background:${col}">Lesson ${n0}: ${big?'Big':'small'} <b>${t}</b></div><div class="lbl">Read and Write.</div><div class="big2" style="color:${col}">${t}</div><div class="trow">${traceLetters((t+' ').repeat(3).trim())}</div><div class="big2" style="color:${col}">${t}</div><div class="trow">${traceLetters((t+' ').repeat(3).trim())}</div></div>
        <div class="wcards">${ws.map(([w,p])=>`<div class="wc">${pic(p)}<span>${hiLetter(w,ch)}</span>${sayBtn(w)}</div>`).join('')}</div></div>`,P.length)});
      P.push({html:pg('',`<p class="act" style="text-align:center">Color the letter! <span class="zh">點字母換顏色</span></p>${outlineLetter(t)}`,P.length)});
    }else{
      P.push({html:pg('',`<div class="ph1"><div><div class="ltab" style="background:${col}">Lesson ${n0}: Capital <b>${ch}</b> small <b>${lo}</b></div><div class="lbl">Read and Write.</div><div class="big2" style="color:${col}">${ch}</div><div class="trow">${traceLetters((ch+' ').repeat(3).trim())}</div><div class="big2" style="color:${col}">${lo}</div><div class="trow">${traceLetters((lo+' ').repeat(3).trim())}</div></div>
        <div><p class="act">Circle the letter ${lo} in each word.<span class="zh">點一下每個字裡的 ${lo}</span></p><div class="wcards four">${words.map(([w,p])=>`<div class="wc">${pic(p)}<span class="circ">${esc(w).split('').map(c=>`<i data-ok="${c.toLowerCase()===lo?1:0}">${c}</i>`).join('')}</span></div>`).join('')}</div></div></div>`,P.length)});
      P.push({html:pg('',letterHunt(ch),P.length)});
      P.push({html:pg('sent',`<div class="art" data-phon="${i}"></div><div class="line">${sayBtn(s1.replace(/[{}]/g,''))}<span>${phonFmt(s1)}</span></div>`,P.length)});
      P.push({html:pg('',`<div class="frames"><div class="frame">${pic(words[0][1])}<p>${phonFmt(s2)}</p>${sayBtn(s2.replace(/[{}]/g,''))}</div><div class="frame">${pic(words[1][1])}<p>${hiLetter(words[1][0],ch)}, ${hiLetter(words[2][0],ch)}, ${hiLetter(words[3][0],ch)}</p>${sayBtn(words.slice(1).map(w=>w[0]).join(', '))}</div></div>`,P.length)});
    }});
  if(P.length%2===0) P.push(blankPage(P.length));
  P.push(backPage(B)); return {P,toc};
}

/* ---------- flip book ---------- */
const reader=document.getElementById('reader'), stage=document.getElementById('stage');
let BK=null; // {B,P,toc,mode,pw,ph,leaves,cur,el}
function layout(){const W=Math.min(innerWidth-32,1240), H=innerHeight-150; const spread=innerWidth>=820;
  let pw=spread?Math.min(W/2,H*4/3):Math.min(W,H*4/3); pw=Math.max(240,Math.floor(pw)); return {mode:spread?'spread':'single',pw,ph:Math.round(pw*.75)};}
function faceHTML(i,side){const p=BK.P[i]; if(!p) return `<div class="face ${side}"></div>`;
  return `<div class="face ${side}${p.cover?' cover-face':''}" data-i="${i}"><span class="ear"></span></div>`;}
function buildBook(B,startPage=0){
  const built=B.kind==='talk'?talkPages(B):B.kind==='sight'?sightPages(B):phonPages(B);
  const L=layout();
  BK={B,...built,...L,rendered:new Set()};
  const n=BK.P.length;
  BK.leaves=BK.mode==='spread'?Math.ceil(n/2):n;
  BK.cur=BK.mode==='spread'?Math.ceil(startPage/2):startPage;
  const el=document.createElement('div'); el.className='book '+BK.mode;
  el.style.width=(BK.mode==='spread'?BK.pw*2:BK.pw)+'px'; el.style.height=BK.ph+'px'; el.style.fontSize=(BK.pw/30)+'px';
  let h='';
  for(let k=0;k<BK.leaves;k++){
    const f=BK.mode==='spread'?2*k:k, bk=BK.mode==='spread'?2*k+1:-1;
    h+=`<div class="leaf" data-k="${k}">${faceHTML(f,'front')}${faceHTML(bk,'back')}</div>`;
  }
  el.innerHTML=h; stage.innerHTML=''; stage.appendChild(el); BK.el=el;
  document.getElementById('rtitle').textContent=B.title;
  document.getElementById('toc').innerHTML=`<option value="">跳到…</option>`+BK.toc.map(([t,p])=>`<option value="${p}">${esc(t)}</option>`).join('');
  apply(true);
}
function fill(i){ if(i<0||i>=BK.P.length||BK.rendered.has(i)) return; const face=BK.el.querySelector(`.face[data-i="${i}"]`); if(!face) return;
  BK.rendered.add(i); face.insertAdjacentHTML('beforeend',BK.P[i].html);
  face.querySelectorAll('[data-scene]').forEach(a=>a.innerHTML=sceneArt(a.dataset.scene,+a.dataset.seed));
  face.querySelectorAll('[data-phon]').forEach(a=>{const b=BK.B.data,[ch,words,s1]=PHON[b.from+(+a.dataset.phon)];a.innerHTML=phonScene(s1,words,b.from+(+a.dataset.phon));});
}
function visiblePages(){return BK.mode==='spread'?[2*BK.cur-1,2*BK.cur]:[BK.cur];}
function apply(instant){
  const leaves=[...BK.el.querySelectorAll('.leaf')];
  leaves.forEach((lf,k)=>{const fl=k<BK.cur; if(instant) lf.style.transition='none';
    if(fl!==lf.classList.contains('flipped')){ if(!instant){lf.classList.add('turning');setTimeout(()=>lf.classList.remove('turning'),900);} lf.style.zIndex=1000; lf.classList.toggle('flipped',fl);
      setTimeout(()=>{lf.style.zIndex=fl?k:BK.leaves-k;},instant?0:450); }
    else lf.style.zIndex=fl?k:BK.leaves-k;
    if(instant){void lf.offsetWidth; lf.style.transition='';}});
  const closedFront=BK.cur===0, closedBack=BK.cur===BK.leaves;
  if(BK.mode==='spread') BK.el.style.transform=closedFront?`translateX(${-BK.pw/2}px)`:closedBack?`translateX(${BK.pw/2}px)`:'none';
  BK.el.classList.toggle('closed',closedFront||closedBack);
  const vp=visiblePages(); for(let d=-3;d<=4;d++) vp.forEach(p=>fill(p+d));
  const shown=vp.filter(p=>p>=0&&p<BK.P.length);
  document.getElementById('pcount').textContent=closedFront?'封面':closedBack?'封底':`第 ${shown.join('–')} 頁 / ${BK.P.length-1}`;
  document.getElementById('prev').disabled=BK.cur===0; document.getElementById('next').disabled=BK.cur===BK.leaves-(BK.mode==='single'?1:0);
}
function go(to){ if(!BK) return; const max=BK.mode==='single'?BK.leaves-1:BK.leaves; to=Math.max(0,Math.min(max,to)); if(to===BK.cur) return;
  const step=to>BK.cur?1:-1, n=Math.abs(to-BK.cur);
  if(n===1){BK.cur=to;apply();return;}
  // flip several leaves in a quick ripple
  let i=0; const t=setInterval(()=>{BK.cur+=step;apply();if(++i>=n) clearInterval(t);},110);
}
function jumpToPage(p){go(BK.mode==='spread'?Math.ceil(p/2):p);}

/* ---------- open / close ---------- */
function openBook(id,spineEl){
  const B=BOOKS.find(b=>b.id===id); if(!B) return;
  reader.hidden=false; reader.classList.add('fade'); buildBook(B,0);
  try{history.replaceState(null,'','#'+id)}catch(e){}
  const target=BK.el.querySelector('.leaf[data-k="0"] .face.front').getBoundingClientRect();
  if(spineEl && !matchMedia('(prefers-reduced-motion: reduce)').matches){
    const r=spineEl.getBoundingClientRect(), f=document.createElement('div'); f.className='flyer'; f.innerHTML=coverOf(B);
    Object.assign(f.style,{left:r.left+'px',top:r.top+'px',width:r.width+'px',height:r.height+'px',transform:'rotateY(70deg)'});
    document.body.appendChild(f); spineEl.style.visibility='hidden';
    requestAnimationFrame(()=>requestAnimationFrame(()=>{Object.assign(f.style,{left:target.left+'px',top:target.top+'px',width:target.width+'px',height:target.height+'px',transform:'none'});reader.classList.remove('fade');}));
    setTimeout(()=>{f.remove();spineEl.style.visibility='';setTimeout(()=>go(1),250);},760);
  }else{reader.classList.remove('fade');setTimeout(()=>go(1),300);}
  document.getElementById('next').focus({preventScroll:true});
}
function closeBook(){ if(!BK) return; try{speechSynthesis.cancel()}catch(e){}
  reader.classList.add('fade'); setTimeout(()=>{reader.hidden=true;stage.innerHTML='';const id=BK.B.id;BK=null;try{history.replaceState(null,'','#')}catch(e){};const s=document.querySelector(`.spine[data-id="${id}"]`);if(s)s.focus({preventScroll:true});},350);}

/* ---------- events ---------- */
buildShelves();
document.getElementById('brand').src=LOGO;
document.getElementById('case').addEventListener('click',e=>{const s=e.target.closest('.spine,.faceout'); if(s) openBook(s.dataset.id,s.classList.contains('faceout')?s.querySelector('svg'):s);});
document.getElementById('closeBtn').onclick=closeBook;
document.getElementById('prev').onclick=()=>go(BK.cur-1);
document.getElementById('next').onclick=()=>go(BK.cur+1);
document.getElementById('toc').onchange=e=>{if(e.target.value!=='') jumpToPage(+e.target.value); e.target.value='';};
stage.addEventListener('click',e=>{ if(!BK) return;
  const say=e.target.closest('[data-say]'); if(say){speak(say.dataset.say);return;}
  const ci=e.target.closest('.circ i'); if(ci){ if(ci.dataset.ok==='1') ci.classList.toggle('on'); else {ci.classList.add('no-shake');setTimeout(()=>ci.classList.remove('no-shake'),400);} return;}
  const hc=e.target.closest('.hc'); if(hc){const h=hc.closest('.hunt'),ch=h.dataset.ch; if(hc.dataset.c.toUpperCase()===ch) hc.classList.toggle('on'); else {hc.classList.add('no-shake');setTimeout(()=>hc.classList.remove('no-shake'),400);} const got=h.querySelectorAll('.hc.on').length; h.querySelector('.hscore').innerHTML=got==h.dataset.total?'全部找到了！Great job!':`找到 <b>${got}</b> / ${h.dataset.total}`; return;}
  const ol=e.target.closest('.outline'); if(ol){const t=ol.querySelector('text'),c=['#ffb4a2','#ffd166','#9ad1f5','#b8e09a','#d7b8f3','#fff'];t.setAttribute('fill',c[(c.indexOf(t.getAttribute('fill'))+1)%c.length]);return;}
  if(e.target.closest('button,select,a')) return;
  const face=e.target.closest('.face'); if(face){ face.classList.contains('back')?go(BK.cur-1):go(BK.cur+1); }
});
let sx=null; stage.addEventListener('touchstart',e=>{sx=e.touches[0].clientX},{passive:true});
stage.addEventListener('touchend',e=>{if(sx==null||!BK) return; const dx=e.changedTouches[0].clientX-sx; if(Math.abs(dx)>50) go(BK.cur+(dx<0?1:-1)); sx=null;});
document.addEventListener('keydown',e=>{ if(!BK) return; if(e.key==='ArrowRight') go(BK.cur+1); else if(e.key==='ArrowLeft') go(BK.cur-1); else if(e.key==='Escape') closeBook(); });
let rz; addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{ if(!BK) return; const L=layout(); if(L.pw===BK.pw&&L.mode===BK.mode) return; const page=BK.mode==='spread'?Math.max(0,2*BK.cur-1):BK.cur; buildBook(BK.B,page);},200);});
fillVoiceMenu();
document.getElementById('voiceSel').onchange=e=>{chosen=e.target.value;try{localStorage.setItem('flyhigh-voice',chosen)}catch(err){}};
document.getElementById('voiceTest').onclick=()=>speak('Hello! I am Zippy. Let\'s fly!');
try{const h=location.hash.slice(1); const s=document.querySelector(`.spine[data-id="${h}"]`); if(s) setTimeout(()=>openBook(h,s),300);}catch(e){}

</script>
